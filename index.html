<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Poscal</title>
    <meta name="description" content="Poscal — forex and CFD position sizing, economic calendar, and journal tools." />

    <meta property="og:title" content="Poscal" />
    <meta property="og:description" content="Forex and CFD position sizing, economic calendar, and trading journal." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply theme + font before paint to prevent flash
      (function() {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
          var font = localStorage.getItem('appFont');
          if (font === 'classic' || font === 'markets') {
            document.documentElement.setAttribute('data-font', font);
          } else {
            document.documentElement.setAttribute('data-font', 'markets');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-font', 'markets');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
